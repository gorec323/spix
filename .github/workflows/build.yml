name: Build and Test
on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  schedule:
    - cron:  '0 0 * * 0' # weekly

jobs:
  build:
    runs-on: ${{ matrix.base.os }}
    strategy:
      fail-fast: false
      matrix:
        base: [
          # The Qt 6 jobs below all use the same two versions on every platform, so a
          # failure points at the platform rather than at a version skew between them.
          # The floor is Qt 6.9.2, forced by macOS: macos-latest is now macOS 26 (Tahoe),
          # whose SDK dropped the legacy AGL framework, while older Qt builds still list
          # `-framework AGL` in their link interface and fail to link with
          # "ld: framework 'AGL' not found". Fixed upstream in Qt 6.8.4 / 6.9.2
          # (QTBUG-137687), and since the open source aqt repos only publish up to 6.8.3,
          # 6.9.2 is the oldest version we can actually install.
          # Windows independently needs a recent Qt too: windows-latest ships Visual
          # Studio 2026, whose STL removed stdext::make_checked_array_iterator. Qt only
          # guards that call behind _MSC_VER from 6.6 onwards, so Qt <= 6.5 cannot be
          # compiled by MSVC 2026 at all.
          #
          # Qt v5.15.2
          # Pinned to windows-2022 (Visual Studio 2022): Qt 5.15 uses the removed
          # stdext::make_checked_array_iterator unconditionally and 5.15.2 is the last
          # open source 5.15 release, so there is no newer Qt 5 to move to. windows-2022
          # is GitHub's supported image for projects that still need VS 2022.
          # (no macOS - Qt 5.15 lacks ARM64 support and macos-13 is deprecated)
          {name: 'qt-5.15.2 ubuntu', os: ubuntu-latest, build_type: Debug, qt_version: [5, 15, 2], shared_libs: 'OFF', tests: 'ON', qtwidgets: 'OFF'},
          {name: 'qt-5.15.2 windows', os: windows-2022, build_type: Debug, qt_version: [5, 15, 2], shared_libs: 'OFF', tests: 'ON', qtwidgets: 'OFF', cmake_flags: '"-DAnyRPC_ROOT=C:/Program Files (x86)/AnyRPC" "-DGTest_ROOT=C:/Program Files (x86)/googletest-distribution"'},
          # Qt v6.9.2
          {name: 'qt-6.9.2 ubuntu', os: ubuntu-latest, build_type: Debug, qt_version: [6, 9, 2], shared_libs: 'OFF', tests: 'ON', qtwidgets: 'ON'},
          {name: 'qt-6.9.2 windows', os: windows-latest, build_type: Debug, qt_version: [6, 9, 2], shared_libs: 'OFF', tests: 'ON', qtwidgets: 'ON', cmake_flags: '"-DAnyRPC_ROOT=C:/Program Files (x86)/AnyRPC" "-DGTest_ROOT=C:/Program Files (x86)/googletest-distribution"'},
          {name: 'qt-6.9.2 macos', os: macos-latest, build_type: Debug, qt_version: [6, 9, 2], shared_libs: 'OFF', tests: 'ON', qtwidgets: 'ON'},
          # Qt v6.11.0
          {name: 'qt-6.11.0 ubuntu', os: ubuntu-latest, build_type: Debug, qt_version: [6, 11, 0], shared_libs: 'OFF', tests: 'ON', qtwidgets: 'ON'},
          {name: 'qt-6.11.0 windows', os: windows-latest, build_type: Debug, qt_version: [6, 11, 0], shared_libs: 'OFF', tests: 'ON', qtwidgets: 'ON', cmake_flags: '"-DAnyRPC_ROOT=C:/Program Files (x86)/AnyRPC" "-DGTest_ROOT=C:/Program Files (x86)/googletest-distribution"'},
          {name: 'qt-6.11.0 macos', os: macos-latest, build_type: Debug, qt_version: [6, 11, 0], shared_libs: 'OFF', tests: 'ON', qtwidgets: 'ON'},
          # shared libs
          {name: 'shared-libs ubuntu', os: ubuntu-latest, build_type: Debug, qt_version: [6, 9, 2], shared_libs: 'ON', tests: 'OFF', qtwidgets: 'ON'},
          {name: 'shared-libs windows', os: windows-latest, build_type: Debug, qt_version: [6, 9, 2], shared_libs: 'ON', tests: 'OFF', qtwidgets: 'ON', cmake_flags: '"-DAnyRPC_ROOT=C:/Program Files (x86)/AnyRPC" "-DGTest_ROOT=C:/Program Files (x86)/googletest-distribution"'},
          {name: 'shared-libs macos', os: macos-latest, build_type: Debug, qt_version: [6, 9, 2], shared_libs: 'ON', tests: 'OFF', qtwidgets: 'ON'},
          # release build
          {name: 'release ubuntu', os: ubuntu-latest, build_type: Release, qt_version: [6, 9, 2], shared_libs: 'OFF', tests: 'ON', qtwidgets: 'ON'},
          # compilers
          {name: 'clang++ ubuntu', os: ubuntu-latest, build_type: Debug, qt_version: [6, 9, 2], shared_libs: 'OFF', tests: 'ON', qtwidgets: 'ON', cmake_flags: '-DCMAKE_CXX_COMPILER=clang++', triplet: 'x64-linux'},
          {name: 'g++ ubuntu', os: ubuntu-latest, build_type: Debug, qt_version: [6, 9, 2], shared_libs: 'OFF', tests: 'ON', qtwidgets: 'ON', cmake_flags: '-DCMAKE_CXX_COMPILER=g++', triplet: 'x64-linux'},
        ]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Qt
        # uses: jurplel/install-qt-action@v4 (the original, but older)
        uses: jdpurcell/install-qt-action@v5 # the fork
        env:
          # special option to trust some mirrors while download.qt.io is down
          # and while one of the mirrors has SSL issues.
          # This is safe enough as we don't release any binaries from here and don't
          # have any secrets to protect. We only need qt to run tests and examples.
          AQT_CONFIG: ${{ github.workspace }}/ci/aqt-settings.ini
        with:
          version: ${{ join(matrix.base.qt_version, '.') }}
          cache: true

      - name: Install dependencies
        env:
          CI_BUILD_TYPE: ${{ matrix.base.build_type }}
          SHARED_LIBS: ${{ matrix.base.shared_libs }}
        run: sh ./ci/install-deps.sh

      - name: "Configure"
        run: |
          mkdir build
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.base.build_type }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSPIX_BUILD_TESTS=${{ matrix.base.tests }} -DSPIX_BUILD_EXAMPLES=ON -DSPIX_BUILD_QTWIDGETS=${{ matrix.base.qtwidgets }} ${{ matrix.base.cmake_flags }} -DBUILD_SHARED_LIBS=${{ matrix.base.shared_libs }} -DSPIX_QT_MAJOR=${{ matrix.base.qt_version[0] }} .

      - name: "Print cmake compile commands"
        if: ${{ !contains(matrix.base.os, 'windows') }}
        run: cat build/compile_commands.json

      - name: "Build"
        run: cmake --build build --config ${{ matrix.base.build_type }}

      - name: "Run Tests"
        run: cd build && ctest -VV -C ${{ matrix.base.build_type }} && cd ..

      - name: "Install Spix (*nix)"
        if: ${{ !contains(matrix.base.os, 'windows') }}
        run: sudo cmake --install build --config ${{ matrix.base.build_type }}

      - name: "Install Spix (win)"
        if: ${{ contains(matrix.base.os, 'windows') }}
        run: cmake --install build --config ${{ matrix.base.build_type }}

      - name: "Build Standalone Example"
        run: |
          cd examples/qtquick/BasicStandalone
          mkdir build
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.base.build_type }} -DSPIX_QT_MAJOR=${{ matrix.base.qt_version[0] }} ${{ matrix.base.cmake_flags}} .
          cmake --build build --config ${{ matrix.base.build_type }}
